services:
  app:
    build:
      context: ./docker/php
    container_name: liqd-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: liqd
      DB_USERNAME: liqd
      DB_PASSWORD: secret
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - liqd

  nginx:
    image: nginx:1.27-alpine
    container_name: liqd-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - liqd

  mysql:
    image: mysql:8.4
    container_name: liqd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: liqd
      MYSQL_USER: liqd
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - liqd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - liqd

  redis:
    image: redis:7-alpine
    container_name: liqd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - liqd_redis_data:/data
    networks:
      - liqd

volumes:
  liqd_mysql_data:
  liqd_redis_data:

networks:
  liqd:
    driver: bridge
